# Copy this file to config/local.yaml and replace localhost endpoints with your
# private model service addresses. Do not commit config/local.yaml.
paths:
  project_root: ..
  data_dir: data
  artifacts_dir: artifacts
  qdrant_path: artifacts/15_vector_store/qdrant
  temp_dir: tmp

services:
  embedding_endpoint: http://111.19.156.74:8001/v1/embeddings
  embedding_model: qwen3-embedding-8b
  rerank_endpoint: http://111.19.156.74:8002/rerank
  rerank_model: ""
  chat_endpoint: http://111.19.156.30:8006/v1/chat/completions
  chat_model: deepseek-v4-flash
  chat_api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 120

qdrant:
  collection_name: datacenter_chunks_v1
  # Leave empty to use local qdrant_path. Set to http://localhost:6333 to use the Docker Compose Qdrant service.
  url: ""
  api_key_env: QDRANT_API_KEY
  prefer_grpc: false
  timeout: 60

retrieval:
  target_namespace: xixian_4
  global_namespace: global
  query_layers: [fact, evidence, intro_doc, raw_text, meta]
  plan: layered
  vector_top_k: 40
  rerank_top_n: 10
  layer_top_k: 8
  layer_rerank_top_n: 5
  max_reference_chunks: 5
  expand_parent_payload: false
  parent_payload_max_chars: 300
  parent_payload_include_neighbors: true
  parent_payload_neighbor_window: 1
  parent_payload_include_raw_parent_text: true
  layered_plan:
    - layer_name: target_main_fact
      description: 目标机房主知识库事实行，优先作为可填答案来源。
      namespaces: target
      corpus_layers: [fact, evidence]
      source_types: [main_excel_capability]
      vector_top_k: 16
      rerank_top_n: 5
    - layer_name: target_structured_detail
      description: 目标机房下钻出来的结构化表格内容，用于补充主表不足。
      namespaces: target
      corpus_layers: [fact]
      source_types: [embedded_word_table]
      vector_top_k: 12
      rerank_top_n: 3
    - layer_name: target_raw_detail
      description: 目标机房下钻原文段落或表格行，只做补充线索。
      namespaces: target
      corpus_layers: [raw_text]
      source_types: [embedded_raw_segment]
      vector_top_k: 12
      rerank_top_n: 3
    - layer_name: global_intro
      description: 全局介绍文档，用于解释园区级背景，不应无理由覆盖目标机房主表。
      namespaces: global
      corpus_layers: [intro_doc]
      source_types: [intro_doc_paragraph, intro_doc_table_row]
      vector_top_k: 10
      rerank_top_n: 3
    - layer_name: global_detail
      description: 全局下钻结构化或原文材料，只做低优先级补充。
      namespaces: global
      corpus_layers: [fact, raw_text]
      source_types: [embedded_word_table, embedded_raw_segment]
      vector_top_k: 10
      rerank_top_n: 2

grounding:
  evidence_strength_enabled: true
  field_binding_enabled: true
  field_binding_agent_enabled: false
  slot_decomposition_enabled: true
  pre_writeback_consistency_enabled: true
  min_strength_for_answered: E3
  min_strength_for_writeback: E3
  require_target_source_for_answered: true
  global_intro_answer_allowed: false
  downgrade_unsupported_answer_to_partial: false
  write_grounding_trace: true

evaluation:
  default_rows: [4, 5, 13, 16, 25, 26, 31, 36, 53, 117]
  timeout_seconds: 120
  resume: false
  judge_model: deepseek-v4-flash
  metrics_output: artifacts/15_vector_store/base_cloud_closed_book_eval/summary.json

excel:
  template_path: data/工勘单/基地云机房信息调研表.xlsx
  output_path: artifacts/excel_outputs/base_cloud_filled.xlsx
  write_mode: copy
  write_comments: true
  preserve_styles: true

writeback:
  allow_uncertain: false
  uncertain_style: red_fill
  uncertain_comment_prefix: "[UNCERTAIN]"
  embed_evidence_images: true
  evidence_image_mode: adjacent_columns
  max_evidence_images_per_field: 3
  max_comment_chars: 2000
  evidence_image_max_width_px: 360
  evidence_image_max_height_px: 240

agent:
  retrieval_backend: mini
  generation_backend: deterministic
  enable_rerank: false
  max_repair_attempts: 1
  confidence_threshold: 0.65
  require_evidence_for_answer: true
  human_review_threshold: 0.55
  skip_generation_when_no_evidence: true
  human_review_on_conflict: true
  llm_json_repair: true
