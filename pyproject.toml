[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-doc-rag"
version = "0.2.0"
description = "Nested document RAG pipeline for datacenter gongkan forms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agentscope>=2.0,<3",
  "openpyxl>=3.1",
  "pydantic>=2,<3",
  "python-docx>=1.1",
  "qdrant-client>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.15",
]

[project.scripts]
nested-doc-rag = "nested_doc_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests", "apps", "nested_doc_rag"]
exclude = [
  ".git",
  "artifacts",
  "data",
  "tmp_ole_probe",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F403"]
