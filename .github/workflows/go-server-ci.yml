name: go-server-ci

on:
  pull_request:
  push:
    branches:
      - main
      - chore/python-core-freeze
      - ops/docker-worker-python-core

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Gofmt check
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Build Worker
        run: go build ./cmd/worker

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python Core
        run: python -m compileall src

      - name: Test Python Core
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs:
      - go
      - python
    defaults:
      run:
        working-directory: go-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare prod env
        run: cp deployments/.env.prod.example deployments/.env.prod

      - name: Compose config
        run: docker compose --env-file deployments/.env.prod -f deployments/docker-compose.prod.yaml config

      - name: Build API and Worker images
        run: docker compose --env-file deployments/.env.prod -f deployments/docker-compose.prod.yaml build api worker

      - name: Worker image smoke
        run: docker compose --env-file deployments/.env.prod -f deployments/docker-compose.prod.yaml run --rm --no-deps worker python -c "import nested_doc_rag; print('python core ok')"
