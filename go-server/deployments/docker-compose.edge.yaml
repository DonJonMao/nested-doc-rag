services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
