services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GONGKAN_PUBLIC_HTTP_PORT:-8003}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GONGKAN_WEB_DIST_PATH:-../../web/dist}:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
