openapi: 3.0.3
info:
  title: Gongkan Platform Go Backend
  version: 0.3.0
  description: Industrial platform API for nested-doc-rag Block 0 through Block 3.
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: At least one dependency failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/ping:
    get:
      summary: API ping
      responses:
        "200":
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/login:
    post:
      summary: Login with username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access and refresh token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Invalid refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/me:
    get:
      summary: Get current authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/users:
    post:
      summary: Create user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    get:
      summary: List users.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}:
    get:
      summary: Get user.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}/status:
    patch:
      summary: Set user status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStatusRequest"
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}/roles:
    post:
      summary: Assign global role to user.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces:
    post:
      summary: Create workspace.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "200":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      summary: List current user's workspaces, or all workspaces for admin.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces/{workspace_id}:
    get:
      summary: Get workspace by id.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces/{workspace_id}/members:
    get:
      summary: List workspace members.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      summary: Add or update workspace member role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMemberRequest"
      responses:
        "200":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/files:
    post:
      summary: Upload a workspace-scoped file.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFileRequest"
      responses:
        "200":
          description: Uploaded file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    get:
      summary: List workspace files.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: file_category
          in: query
          schema:
            type: string
            enum: [knowledge_document, form_template, proof_attachment, misc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
  /api/v1/files/{file_id}:
    get:
      summary: Get file metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      summary: Soft delete file metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File soft deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/files/{file_id}/download:
    get:
      summary: Download file through Go proxy.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/artifacts/{artifact_id}:
    get:
      summary: Get run artifact metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: Artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/artifacts/{artifact_id}/download:
    get:
      summary: Download run artifact through Go proxy.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: Artifact stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/runs/{run_id}/artifacts:
    get:
      summary: List artifacts for a run id.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
  /api/v1/jobs:
    get:
      summary: List workspace jobs.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Workspace jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
  /api/v1/jobs/{job_id}:
    get:
      summary: Get job by id.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Job"
  /api/v1/jobs/{job_id}/cancel:
    post:
      summary: Request job cancellation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
  /api/v1/runs/{run_id}/events:
    get:
      summary: Subscribe to persisted and live run events.
      description: Streams Server-Sent Events from persisted run_events plus a Redis-backed realtime bridge. Use after_sequence to replay missed events after reconnect.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: after_sequence
          in: query
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: SSE stream of run events.
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/admin/noop-jobs:
    post:
      summary: Create an infrastructure-only noop job for queue and SSE verification.
      description: Registered only when jobs.enable_noop_job is true. This is not a business job API.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopJobRequest"
      responses:
        "200":
          description: Noop job created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Job"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: req_123
    ApiErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: invalid username or password
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: req_123
    ReadyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: ok
                checks:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    database: ok
                    redis: ok
                    storage: ok
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: ChangeMe123!
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, disabled]
        roles:
          type: array
          items:
            type: string
            enum: [admin, operator, reviewer, viewer]
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        display_name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [admin, operator, reviewer, viewer]
    SetUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]
    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, operator, reviewer, viewer]
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    AddWorkspaceMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, operator, reviewer, viewer]
    UploadFileRequest:
      type: object
      required: [workspace_id, file_category, file]
      properties:
        workspace_id:
          type: string
          format: uuid
        file_category:
          type: string
          enum: [knowledge_document, form_template, proof_attachment, misc]
        file:
          type: string
          format: binary
    UploadFileResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/File"
    FileListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/File"
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        filename:
          type: string
        original_filename:
          type: string
        file_size:
          type: integer
          format: int64
        mime_type:
          type: string
        sha256:
          type: string
        file_category:
          type: string
          enum: [knowledge_document, form_template, proof_attachment, misc]
        status:
          type: string
          enum: [active, deleted, quarantined]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    ArtifactListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RunArtifact"
    RunArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        artifact_type:
          type: string
          enum:
            - predictions_raw
            - predictions
            - agent_overlays
            - predictions_agent_view
            - review_items
            - trace
            - trace_summary
            - run_summary
            - summary
            - run_manifest
            - filled_form
            - writeback_audit
            - evidence_map
        filename:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
          format: int64
        sha256:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum:
        - created
        - queued
        - running
        - succeeded
        - completed_with_failures
        - failed
        - canceled
        - cancel_requested
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        job_type:
          type: string
          enum: [noop, ingest_knowledge, fill_form, archive_artifacts]
        resource_type:
          type: string
          enum: [noop, knowledge_base, fill_run, artifact_archive]
        resource_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        priority:
          type: integer
        attempt:
          type: integer
        max_attempts:
          type: integer
        payload:
          type: object
          additionalProperties: true
        error_message:
          type: string
        cancel_requested_at:
          type: string
          format: date-time
          nullable: true
        queued_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        heartbeat_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JobListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                jobs:
                  type: array
                  items:
                    $ref: "#/components/schemas/Job"
    RunEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
          enum:
            - queued
            - running
            - heartbeat
            - progress
            - checkpoint_written
            - succeeded
            - completed_with_failures
            - failed
            - canceled
            - cancel_requested
            - review_item_created
            - writeback_completed
        sequence:
          type: integer
          format: int64
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    NoopJobRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          format: uuid
        sleep_ms:
          type: integer
          default: 0
    CancelJobResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                job:
                  $ref: "#/components/schemas/Job"
                canceled:
                  type: boolean
