openapi: 3.0.3
info:
  title: Gongkan Platform Go Backend
  version: 0.6.0
  description: Industrial platform API for nested-doc-rag Block 0 through Block 6. Block 6 adds knowledge base, knowledge document, index version, and ingestion run APIs backed by jobs, worker, PythonRunner, and artifacts.
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: At least one dependency failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/ping:
    get:
      summary: API ping
      responses:
        "200":
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/login:
    post:
      summary: Login with username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access and refresh token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Invalid refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/auth/me:
    get:
      summary: Get current authenticated user.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/users:
    post:
      summary: Create user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    get:
      summary: List users.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}:
    get:
      summary: Get user.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}/status:
    patch:
      summary: Set user status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStatusRequest"
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/users/{user_id}/roles:
    post:
      summary: Assign global role to user.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "200":
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces:
    post:
      summary: Create workspace.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "200":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      summary: List current user's workspaces, or all workspaces for admin.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces/{workspace_id}:
    get:
      summary: Get workspace by id.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/workspaces/{workspace_id}/members:
    get:
      summary: List workspace members.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      summary: Add or update workspace member role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMemberRequest"
      responses:
        "200":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/files:
    post:
      summary: Upload a workspace-scoped file.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFileRequest"
      responses:
        "200":
          description: Uploaded file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    get:
      summary: List workspace files.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: file_category
          in: query
          schema:
            type: string
            enum: [knowledge_document, form_template, proof_attachment, misc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
  /api/v1/files/{file_id}:
    get:
      summary: Get file metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      summary: Soft delete file metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File soft deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/files/{file_id}/download:
    get:
      summary: Download file through Go proxy.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/artifacts/{artifact_id}:
    get:
      summary: Get run artifact metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: Artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/artifacts/{artifact_id}/download:
    get:
      summary: Download run artifact through Go proxy.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: Artifact stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/runs/{run_id}/artifacts:
    get:
      summary: List artifacts for a run id.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactListResponse"
  /api/v1/forms:
    post:
      summary: Upload a gongkan form template.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFormRequest"
      responses:
        "200":
          description: Uploaded form file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFormResponse"
    get:
      summary: List gongkan form templates.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Form files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFileListResponse"
  /api/v1/forms/{form_id}:
    get:
      summary: Get gongkan form metadata.
      security:
        - BearerAuth: []
      parameters:
        - name: form_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Form file.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FormFile"
  /api/v1/fill-runs:
    post:
      summary: Create a gongkan form fill run.
      description: Creates a fill_runs record and enqueues a fill_form job. Python execution happens asynchronously in the worker.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFillRunRequest"
      responses:
        "200":
          description: Fill run created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FillRun"
    get:
      summary: List fill runs.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FillRunStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Fill runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillRunListResponse"
  /api/v1/fill-runs/{run_id}:
    get:
      summary: Get fill run.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Fill run.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FillRun"
  /api/v1/fill-runs/{run_id}/cancel:
    post:
      summary: Cancel a fill run.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Fill run cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelFillRunResponse"
  /api/v1/fill-runs/{run_id}/artifacts:
    get:
      summary: List artifacts for a fill run.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Fill run artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillRunArtifactListResponse"
  /api/v1/fill-runs/{run_id}/download/{artifact_kind}:
    get:
      summary: Download a fill run artifact by shortcut.
      description: artifact_kind supports filled-form, run-summary, review-items, and trace. These are read-only artifact shortcuts; review actions are not implemented in Block 5.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: artifact_kind
          in: path
          required: true
          schema:
            type: string
            enum: [filled-form, run-summary, review-items, trace]
      responses:
        "200":
          description: Artifact bytes or presigned URL depending on artifact settings.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/knowledge-bases:
    post:
      summary: Create a knowledge base.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "200":
          description: Knowledge base created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBase"
    get:
      summary: List knowledge bases in a workspace.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Knowledge bases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseListResponse"
  /api/v1/knowledge-bases/{kb_id}:
    get:
      summary: Get knowledge base metadata.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
      responses:
        "200":
          description: Knowledge base.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBase"
  /api/v1/knowledge-bases/{kb_id}/index-versions:
    get:
      summary: List knowledge index versions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
      responses:
        "200":
          description: Index versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexVersionListResponse"
  /api/v1/knowledge-bases/{kb_id}/current-index-version:
    post:
      summary: Set current ready index version.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCurrentIndexVersionRequest"
      responses:
        "200":
          description: Current index version updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/knowledge-bases/{kb_id}/documents:
    post:
      summary: Upload a knowledge document.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadKnowledgeDocumentRequest"
      responses:
        "200":
          description: Knowledge document uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadKnowledgeDocumentResponse"
    get:
      summary: List knowledge documents.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeDocumentStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Knowledge documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentListResponse"
  /api/v1/documents/{doc_id}:
    delete:
      summary: Soft delete a knowledge document.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentID"
      responses:
        "200":
          description: Knowledge document marked deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/v1/knowledge-bases/{kb_id}/ingestion-runs:
    post:
      summary: Create an ingestion run.
      description: Creates a knowledge_index_versions row, an ingestion_jobs row, and enqueues an ingest_knowledge worker job. If python.ingest_command_enabled=false the API returns FEATURE_DISABLED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngestionRunRequest"
      responses:
        "200":
          description: Ingestion run created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IngestionJob"
        "409":
          description: Ingest command disabled or job cannot be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    get:
      summary: List ingestion runs for a knowledge base.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeBaseID"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IngestionJobStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Ingestion runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJobListResponse"
  /api/v1/ingestion-runs/{ingestion_job_id}:
    get:
      summary: Get ingestion run.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IngestionJobID"
      responses:
        "200":
          description: Ingestion run.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IngestionJob"
  /api/v1/ingestion-runs/{ingestion_job_id}/cancel:
    post:
      summary: Cancel an ingestion run.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IngestionJobID"
      responses:
        "200":
          description: Ingestion cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelIngestionJobResponse"
  /api/v1/ingestion-runs/{ingestion_job_id}/events:
    get:
      summary: Redirect to run event SSE for an ingestion run.
      description: Returns a temporary redirect to /api/v1/runs/{ingestion_job_id}/events?workspace_id=...
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IngestionJobID"
      responses:
        "307":
          description: Redirects to the shared run events SSE endpoint.
  /api/v1/jobs:
    get:
      summary: List workspace jobs.
      description: Lists platform jobs. fill_form and ingest_knowledge payloads are consumed by the worker; public business creation APIs are introduced in later blocks.
      security:
        - BearerAuth: []
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Workspace jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
  /api/v1/jobs/{job_id}:
    get:
      summary: Get job by id.
      description: Returns job metadata and lightweight payload. Block 4 worker payloads may describe Python CLI inputs such as out_dir, template_path, target namespace, or ingestion input paths.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Job metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Job"
  /api/v1/jobs/{job_id}/cancel:
    post:
      summary: Request job cancellation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
  /api/v1/runs/{run_id}/events:
    get:
      summary: Subscribe to persisted and live run events.
      description: Streams Server-Sent Events from persisted run_events plus a Redis-backed realtime bridge. Use after_sequence to replay missed events after reconnect.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: after_sequence
          in: query
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: SSE stream of run events.
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/admin/noop-jobs:
    post:
      summary: Create an infrastructure-only noop job for queue and SSE verification.
      description: Registered only when jobs.enable_noop_job is true. This is not a business job API.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopJobRequest"
      responses:
        "200":
          description: Noop job created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Job"
