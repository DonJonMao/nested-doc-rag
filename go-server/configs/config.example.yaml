server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

database:
  dsn: "postgres://gongkan:gongkan@localhost:5432/gongkan?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 10
  max_conn_lifetime: 1h

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

storage:
  type: "minio"
  local_dir: "./runtime/storage"
  minio:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "gongkan-platform"
    use_ssl: false

auth:
  access_token_ttl: "30m"
  refresh_token_ttl: "168h"
  jwt_secret_env: "GONGKAN_JWT_SECRET"
  bootstrap_admin:
    enabled: true
    username: "admin"
    password_env: "GONGKAN_BOOTSTRAP_ADMIN_PASSWORD"

files:
  max_upload_size: "200MB"
  temp_dir: "./runtime/tmp/uploads"
  allowed_extensions:
    - ".xlsx"
    - ".xlsm"
    - ".docx"
    - ".txt"
    - ".md"
    - ".csv"
    - ".png"
    - ".jpg"
    - ".jpeg"
  allowed_mime_types:
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.ms-excel.sheet.macroEnabled.12"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "text/plain"
    - "text/markdown"
    - "text/csv"
    - "image/png"
    - "image/jpeg"
    - "application/octet-stream"
  delete_object_on_soft_delete: false

artifacts:
  allow_presign_download: false
  download_mode: "proxy"
  default_presign_ttl: "15m"

python:
  executable: "python"
  project_dir: "../"
  config_path: "config/local.yaml"
  default_timeout: "2h"
  artifact_validation_enabled: true
  kill_grace_period: "10s"
  stdout_log_max_bytes: 1048576
  stderr_log_max_bytes: 1048576
  step15_default_retrieval_mode: "layered"
  step15_default_prompt_version: "step15_compat"
  step15_default_rows: "4-144"
  ingest_command_enabled: true

jobs:
  fill_concurrency: 1
  ingestion_concurrency: 1
  max_python_processes: 1
  redis_namespace: "gongkan"
  worker_concurrency: 4
  default_timeout: "2h"
  max_attempts: 3
  retry_backoff: "30s"
  heartbeat_interval: "10s"
  event_buffer_size: 256
  enable_noop_job: false
  event_bus_enabled: true
  event_channel: "gongkan:run_events"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Request-ID"
  allow_credentials: false

logging:
  level: "info"
  encoding: "json"
  development: true

observability:
  metrics_enabled: true
  pprof_enabled: false
  pprof_addr: "127.0.0.1:6060"
  tracing_enabled: false
  tracing_service_name: "gongkan-platform"
  tracing_exporter: "none"
  otlp_endpoint: ""
  log_request_body: false
  log_response_body: false

security:
  security_headers_enabled: true
  rate_limit_enabled: true
  rate_limit_rps: 20
  rate_limit_burst: 40
  body_limit_enabled: true
  max_body_size: "256MB"
  trusted_proxies: []
  cors_allow_credentials: false
  hsts_enabled: false
  hsts_max_age: "720h"

operations:
  graceful_shutdown_timeout: "30s"
  diagnostics_enabled: true
  expose_build_info: true
