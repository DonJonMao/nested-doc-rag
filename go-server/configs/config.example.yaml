server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

database:
  dsn: "postgres://gongkan:gongkan@localhost:5432/gongkan?sslmode=disable"
  max_open_conns: 20
  max_idle_conns: 10
  max_conn_lifetime: 1h

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

storage:
  type: "minio"
  local_dir: "./runtime/storage"
  minio:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "gongkan-platform"
    use_ssl: false

auth:
  access_token_ttl: "30m"
  refresh_token_ttl: "168h"
  jwt_secret_env: "GONGKAN_JWT_SECRET"
  bootstrap_admin:
    enabled: true
    username: "admin"
    password_env: "GONGKAN_BOOTSTRAP_ADMIN_PASSWORD"

files:
  max_upload_size: "200MB"
  temp_dir: "./runtime/tmp/uploads"
  allowed_extensions:
    - ".xlsx"
    - ".xls"
    - ".docx"
    - ".png"
    - ".jpg"
    - ".jpeg"
  allowed_mime_types:
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.ms-excel"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "image/png"
    - "image/jpeg"
    - "application/octet-stream"
  delete_object_on_soft_delete: false

artifacts:
  allow_presign_download: false
  download_mode: "proxy"
  default_presign_ttl: "15m"

python:
  executable: "python"
  project_dir: "../"
  config_path: "config/local.yaml"
  default_timeout: "2h"

jobs:
  fill_concurrency: 2
  ingestion_concurrency: 2
  max_python_processes: 3
  redis_namespace: "gongkan"
  worker_concurrency: 4
  default_timeout: "2h"
  max_attempts: 3
  retry_backoff: "30s"
  heartbeat_interval: "10s"
  event_buffer_size: 256
  enable_noop_job: false

cors:
  allowed_origins:
    - "http://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Request-ID"

logging:
  level: "info"
  encoding: "json"
  development: true
